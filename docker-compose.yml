version: '3.8'

services:
  api:
    build:
      context: .
      # dockerfile: Dockerfile # Optional: specify if your Dockerfile has a different name or location
    ports:
      - "8000:8000" # Exposes port 8000 on the host and maps it to port 8000 in the container
    env_file:
      - ./.env # Loads environment variables from .env file in the project root
    environment:
      - APP_ENV=production # Set application environment to production
    volumes:
      - .:/app # Mounts the current directory into /app in the container for development
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # Example command, adjust as per your Dockerfile CMD/ENTRYPOINT
    networks:
      - xeocast_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # The 'tunnel run' command will automatically use the TUNNEL_TOKEN environment variable.
    command: tunnel --no-autoupdate run
    environment:
      # This maps CLOUDFLARE_TUNNEL_TOKEN (from .env via env_file) to TUNNEL_TOKEN for the container.
      # cloudflared's entrypoint looks for TUNNEL_TOKEN.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - ./.env # Makes variables from .env (like CLOUDFLARE_TUNNEL_TOKEN) available
    depends_on:
      - api
    networks:
      - xeocast_network

networks:
  xeocast_network:
    driver: bridge

volumes: {} # Define any named volumes here if needed 