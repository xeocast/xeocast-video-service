services:
  api:
    image: xeocast/xeocast-video-service:latest
    ports:
      - "8765:8000" # Exposes port 8000 on the host and maps it to port 8000 in the container
    env_file:
      - ./.env # Loads environment variables from .env file in the project root
    environment:
      - APP_ENV=production # Set application environment to production
    volumes:
      # The volume mount '.:/app' from the original docker-compose.yml has been removed.
      # This mount is typically used for development to hot-reload local code changes into the container.
      # For a VPS deployment using a pre-built image like 'xeocast/xeocast-video-service:latest',
      # this mount is generally not needed and could overwrite the code baked into the image.
      - xeocast_tmp_auth:/app/tmp-auth # Persists YouTube Data API access tokens
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # Example command, adjust as per your Dockerfile CMD/ENTRYPOINT

volumes:
  xeocast_tmp_auth: {}
